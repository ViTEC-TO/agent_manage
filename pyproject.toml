[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-remote"
dynamic = ["version"]
description = "Local agent management script for OpenClaw servers."
requires-python = ">=3.10"

[tool.setuptools.dynamic]
version = {attr = "agent_manage.__version__"}

[tool.setuptools.package-data]
agent_manage = ["common_skills/*/SKILL.md", "common_skills/*/agents/*.yaml"]

[project.scripts]
agent-manage = "agent_manage.cli:main"
